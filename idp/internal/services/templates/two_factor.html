<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            background-color: #424242;
        }

        #page-content {
            margin: 0 1em;
            background-color: #f5f5f5;
            border-radius: 1em;
            padding: 1em;
        }

        #title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #title-container h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5em;
            text-align: center;
            color: #222;
            letter-spacing: 1px;
        }

        #logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #logo {
            width: 10vw;
            height: 10vw;
        }

        /* For large screens (desktop) */
        @media (max-width: 1200px) {
            #logo {
                width: 20vw;
                height: 20vw;
            }
        }

        /* For small screens (mobile) */
        @media (max-width: 900px) {
            #logo {
                width: 35vw;
                height: 35vw;
            }
        }

        /* For very small screens */
        @media (max-width: 600px) {
            #logo {
                width: 50vw;
                height: 50vw;
            }
        }


        form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            color: #000;
            outline: none;
            background-color: #FAFAFA;
        }

        button {
            padding: 10px;
            border: 1px solid #000;
            background-color: #000;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 1em;
            padding: 12px 16px;
        }

        button:hover {
            background-color: #333;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5em;
            text-align: center;
            color: #222;
            letter-spacing: 1px;
        }
    </style>
    <title>{{.Title}}</title>
</head>

        </div>
        <h1>Confirm {{.Name}}</h1>
    </div>

    <form action="{{.TwoFAURL}}" method="post">
        <input name="session_id" type="hidden" value="{{.SessionID}}">
        <input name="code_challenge" type="hidden" value="{{.CodeChallenge}}">
        <input name="code_challenge_method" type="hidden" value="{{.CodeChallengeMethod}}">
        <input name="state" type="hidden" value="{{.State}}">
        <input name="redirect_uri" type="hidden" value="{{.RedirectURI}}">
        <input name="csrf_token" type="hidden" value="{{.CSRFToken}}">
        <input
                autofocus
                id="code"
                inputmode="numeric"
                maxlength="6"
                name="code"
                pattern="[0-9]{6}"
                placeholder="Verification Code"
                required
                type="text"
        />
        <button type="submit">Verify</button>
    </form>
</div>
</body>
</html>
